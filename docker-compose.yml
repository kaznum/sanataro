services:
  # MySQL Database Service
  db-mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sanataro_development
      MYSQL_USER: sanataro
      MYSQL_PASSWORD: sanataro_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # PostgreSQL Database Service  
  db-postgresql:
    image: postgres:13
    environment:
      POSTGRES_DB: sanataro_development
      POSTGRES_USER: sanataro
      POSTGRES_PASSWORD: sanataro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanataro -d sanataro_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Service (for caching in production-like environment)
  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Main Web Application (MySQL variant)
  webapp-mysql:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db-mysql:
        condition: service_healthy
    environment:
      DB_ADAPTER: mysql2
      DB_HOST: db-mysql
      DB_NAME: sanataro_development
      DB_USERNAME: sanataro
      DB_PASSWORD: sanataro_password
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
      LOAD_SEEDS: "false"
    volumes:
      - .:/app
      - gem_cache:/usr/local/bundle
      - ./config/database.yml.docker:/app/config/database.yml
    stdin_open: true
    tty: true

  # Main Web Application (PostgreSQL variant)
  webapp-postgresql:
    build: .
    ports:
      - "3001:3000"
    depends_on:
      db-postgresql:
        condition: service_healthy
    environment:
      DB_ADAPTER: postgresql
      DB_HOST: db-postgresql
      DB_NAME: sanataro_development
      DB_USERNAME: sanataro
      DB_PASSWORD: sanataro_password
      REDIS_URL: redis://redis:6379/1
      RAILS_ENV: development
      LOAD_SEEDS: "false"
    volumes:
      - .:/app
      - gem_cache:/usr/local/bundle
      - ./config/database.yml.docker:/app/config/database.yml
    stdin_open: true
    tty: true

volumes:
  mysql_data:
  postgres_data:
  redis_data:
  gem_cache: